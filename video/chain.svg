<svg viewBox="0 0 800 200" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LLM Multi-Model Failover Chain">
  <title>LLM Failover Chain</title>
  <desc>Four language models in sequence. The primary model (gpt-oss-120b) handles requests, automatically falling back across Groq alternatives to Gemini on rate limits or API errors.</desc>

  <defs>
    <filter id="chain-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a1d23" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Connectors: Dashed Red Lines with fail / 429 tags -->
  <g stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 3" fill="none">
    <line x1="180" y1="80" x2="216" y2="80" marker-end="url(#arrow-fail)"/>
    <line x1="375" y1="80" x2="411" y2="80" marker-end="url(#arrow-fail)"/>
    <line x1="570" y1="80" x2="606" y2="80" marker-end="url(#arrow-fail)"/>
  </g>

  <!-- Connector labels above lines -->
  <g font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#dc2626" text-anchor="middle">
    <text x="198" y="70">fail / 429</text>
    <text x="393" y="70">fail / 429</text>
    <text x="588" y="70">fail / 429</text>
  </g>

  <!-- ================= NODE 1: ACTIVE (gpt-oss-120b) ================= -->
  <g transform="translate(25, 28)" filter="url(#chain-shadow)">
    <rect width="155" height="104" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <circle cx="20" cy="22" r="3.5" fill="#22c55e"/>
    <text x="30" y="25" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#4f46e5" letter-spacing="1.2">PRIMARY · ACTIVE</text>
    <text x="77" y="58" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1a1d23">gpt-oss-120b</text>
    <text x="77" y="80" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#5a6271">groq · highest quality</text>
  </g>

  <!-- ================= NODE 2: BACKUP 1 (compound-mini) ================= -->
  <g transform="translate(220, 28)" filter="url(#chain-shadow)">
    <rect width="155" height="104" rx="12" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <text x="77" y="25" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#5a6271" letter-spacing="1.2">BACKUP 1</text>
    <text x="77" y="58" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1d23">compound-mini</text>
    <text x="77" y="80" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#5a6271">70K TPM · zero TPD</text>
  </g>

  <!-- ================= NODE 3: BACKUP 2 (qwen-3.8-27b) ================= -->
  <g transform="translate(415, 28)" filter="url(#chain-shadow)">
    <rect width="155" height="104" rx="12" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <text x="77" y="25" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#5a6271" letter-spacing="1.2">BACKUP 2</text>
    <text x="77" y="58" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1d23">qwen-3.8-27b</text>
    <text x="77" y="80" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#5a6271">independent family</text>
  </g>

  <!-- ================= NODE 4: GEMINI (DIFFERENT PROVIDER) ================= -->
  <g transform="translate(610, 28)" filter="url(#chain-shadow)">
    <rect width="165" height="104" rx="12" fill="#ecfdf5" stroke="#0d9488" stroke-width="2"/>
    <circle cx="20" cy="22" r="3.5" fill="#0d9488"/>
    <text x="30" y="25" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#0d9488" letter-spacing="1">DIFFERENT PROVIDER</text>
    <text x="82" y="58" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1a1d23">Gemini</text>
    <text x="82" y="80" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#065f46">flash-lite · failover</text>
  </g>

  <!-- Bottom Monospace Pipeline Caption -->
  <text x="400" y="174" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5">
    <tspan fill="#4f46e5" font-weight="700">gpt-oss-120b</tspan>
    <tspan fill="#5a6271">  →  </tspan>
    <tspan fill="#5a6271">compound-mini</tspan>
    <tspan fill="#5a6271">  →  </tspan>
    <tspan fill="#5a6271">qwen-3.8-27b</tspan>
    <tspan fill="#5a6271">  →  </tspan>
    <tspan fill="#0d9488" font-weight="700">gemini-flash-lite-latest</tspan>
  </text>
</svg>
