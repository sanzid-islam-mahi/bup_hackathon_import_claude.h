<svg viewBox="0 0 900 220" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LLM Six-Model Failover Chain Across Three Providers">
  <title>LLM Failover Chain (OpenAI primary → Groq fallback → Gemini last resort)</title>
  <desc>Six language models arranged in three provider clusters. OpenAI is primary (gpt-4.1-mini active, gpt-4o-mini backup). On failure the request falls through to Groq (gpt-oss-120b, compound-mini, qwen-3.8-27b) and finally to Gemini on a third provider. Each transition is automatic on rate limits or API errors.</desc>

  <defs>
    <filter id="chain-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a1d23" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ============================================================
       Connectors: dashed red between clusters, with "fail / 429" labels
       Cluster widths/positions:
         OpenAI: x=20, w=240
         Groq:   x=320, w=240  (gap 60)
         Gemini: x=620, w=240  (gap 60)
       Cluster vertical band: y=40..170 (height 130)
       ============================================================ -->
  <g stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 3" fill="none">
    <line x1="260" y1="105" x2="316" y2="105" marker-end="url(#arrow-fail)"/>
    <line x1="560" y1="105" x2="616" y2="105" marker-end="url(#arrow-fail)"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">
    <text x="288" y="95">fail / 429 / 5xx</text>
    <text x="588" y="95">fail / 429 / 5xx</text>
  </g>

  <!-- ============================================================
       Cluster 1: OPENAI · PRIMARY (indigo)
       ============================================================ -->
  <g transform="translate(20, 40)" filter="url(#chain-shadow)">
    <rect width="240" height="130" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
    <!-- Cluster tag -->
    <text x="14" y="20" font-family="ui-monospace, monospace" font-size="9" fill="#4f46e5" letter-spacing="1.5" font-weight="700">OPENAI · PRIMARY</text>

    <!-- gpt-4.1-mini (filled indigo, ACTIVE) -->
    <rect x="14" y="32" width="212" height="26" rx="13" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/>
    <text x="120" y="49" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">gpt-4.1-mini</text>
    <text x="212" y="49" font-family="ui-monospace, monospace" font-size="8" fill="#c7d2fe" text-anchor="end" font-weight="700">ACTIVE</text>

    <!-- gpt-4o-mini (violet outline) -->
    <rect x="14" y="64" width="212" height="22" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="120" y="79" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="600">gpt-4o-mini</text>
  </g>

  <!-- ============================================================
       Cluster 2: GROQ · FALLBACK (amber)
       ============================================================ -->
  <g transform="translate(320, 40)" filter="url(#chain-shadow)">
    <rect width="240" height="130" rx="14" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <!-- Cluster tag -->
    <text x="14" y="20" font-family="ui-monospace, monospace" font-size="9" fill="#d97706" letter-spacing="1.5" font-weight="700">GROQ · FALLBACK</text>

    <!-- gpt-oss-120b -->
    <rect x="14" y="32" width="212" height="22" rx="11" fill="#ffffff" stroke="#d97706" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="120" y="47" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">gpt-oss-120b</text>

    <!-- compound-mini -->
    <rect x="14" y="58" width="212" height="22" rx="11" fill="#ffffff" stroke="#d97706" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="120" y="73" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">compound-mini</text>

    <!-- qwen-3.8-27b -->
    <rect x="14" y="84" width="212" height="22" rx="11" fill="#ffffff" stroke="#d97706" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="120" y="99" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">qwen-3.8-27b</text>
  </g>

  <!-- ============================================================
       Cluster 3: GEMINI · LAST RESORT (teal)
       ============================================================ -->
  <g transform="translate(620, 40)" filter="url(#chain-shadow)">
    <rect width="240" height="130" rx="14" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.5"/>
    <!-- Cluster tag -->
    <text x="14" y="20" font-family="ui-monospace, monospace" font-size="9" fill="#0d9488" letter-spacing="1.5" font-weight="700">GEMINI · LAST RESORT</text>

    <!-- gemini-flash-lite-latest -->
    <rect x="14" y="58" width="212" height="30" rx="15" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
    <text x="120" y="78" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">gemini-flash-lite-latest</text>

    <!-- subtitle -->
    <text x="120" y="108" font-family="ui-monospace, monospace" font-size="8" fill="#0d9488" text-anchor="middle" letter-spacing="0.8">different provider</text>
  </g>

  <!-- ============================================================
       Bottom caption (full chain in order)
       ============================================================ -->
  <g font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">
    <text x="450" y="195">
      <tspan fill="#4f46e5" font-weight="700">gpt-4.1-mini</tspan>
      <tspan fill="#6a7385">  →  </tspan>
      <tspan fill="#7c3aed">gpt-4o-mini</tspan>
      <tspan fill="#6a7385">  →  </tspan>
      <tspan fill="#6a7385">gpt-oss-120b</tspan>
      <tspan fill="#6a7385">  →  </tspan>
      <tspan fill="#6a7385">compound-mini</tspan>
      <tspan fill="#6a7385">  →  </tspan>
      <tspan fill="#6a7385">qwen-3.8-27b</tspan>
      <tspan fill="#6a7385">  →  </tspan>
      <tspan fill="#0d9488" font-weight="700">gemini-flash-lite-latest</tspan>
    </text>
  </g>
  <text x="450" y="212" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#6a7385" text-anchor="middle" letter-spacing="0.4">rotation is automatic — no user-visible failure</text>
</svg>
