<svg viewBox="0 0 1200 380" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GridWise Request Architecture Pipeline">
  <title>GridWise Request Pipeline</title>
  <desc>Flow of an energy optimization request from HTTP ingestion through Pydantic validation, a six-model LLM chain across three providers (OpenAI primary, Groq fallback, Gemini last resort), deterministic guardrails, and HiGHS LP solver to final response, with a heuristic fallback safety net.</desc>

  <defs>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a1d23" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- ============================================================
       Connectors between main stages (drawn first so cards overlay)
       ============================================================ -->
  <g stroke="#4f46e5" stroke-width="1.8" fill="none">
    <!-- 1 → 2 -->
    <line x1="135" y1="155" x2="168" y2="155" marker-end="url(#arrow-indigo)"/>
    <!-- 2 → 3 (chain card starts at 358) -->
    <line x1="315" y1="155" x2="358" y2="155" marker-end="url(#arrow-indigo)"/>
    <!-- 3 → 4 (chain ends at 588) -->
    <line x1="588" y1="155" x2="618" y2="155" marker-end="url(#arrow-indigo)"/>
    <!-- 4 → 5 -->
    <line x1="765" y1="155" x2="798" y2="155" marker-end="url(#arrow-indigo)"/>
    <!-- 5 → 6 -->
    <line x1="945" y1="155" x2="978" y2="155" marker-end="url(#arrow-indigo)"/>
  </g>

  <!-- Fallback heuristic arrow (dotted amber, from chain card down to LP Solve) -->
  <path d="M 478 330 Q 478 360 820 360 Q 858 360 858 195" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow-amber)"/>
  <text x="640" y="355" font-family="ui-monospace, monospace" font-size="11" fill="#d97706" text-anchor="middle" font-weight="600">fallback heuristic (LP infeasible)</text>

  <!-- ============================================================
       Stage 1: Request
       ============================================================ -->
  <g transform="translate(15, 100)" filter="url(#soft-shadow)">
    <rect width="120" height="110" rx="12" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <text x="60" y="28" font-family="ui-monospace, monospace" font-size="10" fill="#6a7385" text-anchor="middle" letter-spacing="1.5">INGEST</text>
    <g transform="translate(40, 38)">
      <rect width="40" height="30" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
      <text x="20" y="20" font-family="ui-monospace, monospace" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="700">{ }</text>
    </g>
    <text x="60" y="88" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="700">Request</text>
    <text x="60" y="102" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6a7385" text-anchor="middle">POST body</text>
  </g>

  <!-- ============================================================
       Stage 2: Validate
       ============================================================ -->
  <g transform="translate(168, 100)" filter="url(#soft-shadow)">
    <rect width="147" height="110" rx="12" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <text x="73" y="28" font-family="ui-monospace, monospace" font-size="10" fill="#6a7385" text-anchor="middle" letter-spacing="1.5">PYDANTIC</text>
    <g transform="translate(53, 38)">
      <rect width="40" height="30" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
      <path d="M 12 16 L 18 22 L 28 10" stroke="#4f46e5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="73" y="88" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="700">Validate</text>
    <text x="73" y="102" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6a7385" text-anchor="middle">400 on bad input</text>
  </g>

  <!-- ============================================================
       Stage 3: LLM Chain (the big highlighted card)
       ============================================================ -->
  <g transform="translate(358, 65)" filter="url(#soft-shadow)">
    <rect width="230" height="200" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>

    <text x="115" y="22" font-family="ui-monospace, monospace" font-size="10" fill="#4f46e5" text-anchor="middle" letter-spacing="2" font-weight="700">LLM CHAIN · 6 MODELS</text>

    <!-- Group A: OpenAI primary -->
    <g transform="translate(15, 32)">
      <text x="0" y="10" font-family="ui-monospace, monospace" font-size="8" fill="#4f46e5" letter-spacing="1.2" font-weight="700">OPENAI · PRIMARY</text>
      <rect x="0" y="14" width="200" height="18" rx="9" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/>
      <text x="100" y="27" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="600">gpt-4.1-mini</text>
      <rect x="0" y="36" width="200" height="18" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="100" y="49" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#7c3aed" text-anchor="middle" font-weight="600">gpt-4o-mini</text>
    </g>

    <!-- Group B: Fallback -->
    <g transform="translate(15, 105)">
      <text x="0" y="10" font-family="ui-monospace, monospace" font-size="8" fill="#d97706" letter-spacing="1.2" font-weight="700">FALLBACK</text>
      <rect x="0" y="14" width="200" height="16" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="100" y="26" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#d97706" text-anchor="middle">gpt-oss-120b</text>
      <rect x="0" y="33" width="200" height="16" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="100" y="45" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#d97706" text-anchor="middle">compound-mini</text>
      <rect x="0" y="52" width="200" height="16" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="100" y="64" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#d97706" text-anchor="middle">qwen-3.8-27b</text>
      <rect x="0" y="71" width="200" height="16" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
      <text x="100" y="83" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#0d9488" text-anchor="middle" font-weight="600">gemini-flash-lite-latest</text>
    </g>

    <text x="115" y="193" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="700" letter-spacing="0.5">Interpret</text>
  </g>

  <!-- ============================================================
       Stage 4: Guard
       ============================================================ -->
  <g transform="translate(618, 100)" filter="url(#soft-shadow)">
    <rect width="147" height="110" rx="12" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <text x="73" y="28" font-family="ui-monospace, monospace" font-size="10" fill="#6a7385" text-anchor="middle" letter-spacing="1.5">SAFE-FAIL</text>
    <g transform="translate(53, 38)">
      <rect width="40" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <path d="M 20 6 L 32 11 L 32 18 Q 32 24 20 28 Q 8 24 8 18 L 8 11 Z" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 15 18 L 19 22 L 26 14" stroke="#d97706" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="73" y="88" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="700">Guard</text>
    <text x="73" y="102" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6a7385" text-anchor="middle">bad note → no_op</text>
  </g>

  <!-- ============================================================
       Stage 5: LP Solve
       ============================================================ -->
  <g transform="translate(798, 100)" filter="url(#soft-shadow)">
    <rect width="147" height="110" rx="12" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <text x="73" y="28" font-family="ui-monospace, monospace" font-size="10" fill="#6a7385" text-anchor="middle" letter-spacing="1.5">HIGHS · ~20 ms</text>
    <g transform="translate(53, 38)">
      <rect width="40" height="30" rx="4" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
      <text x="20" y="24" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#0d9488" text-anchor="middle" font-weight="700">∑</text>
    </g>
    <text x="73" y="88" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="700">LP Solve</text>
    <text x="73" y="102" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6a7385" text-anchor="middle">120 vars · optimal</text>
  </g>

  <!-- ============================================================
       Stage 6: Response
       ============================================================ -->
  <g transform="translate(978, 100)" filter="url(#soft-shadow)">
    <rect width="120" height="110" rx="12" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <text x="60" y="28" font-family="ui-monospace, monospace" font-size="10" fill="#6a7385" text-anchor="middle" letter-spacing="1.5">JSON 200</text>
    <g transform="translate(40, 38)">
      <rect width="40" height="30" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
      <text x="20" y="20" font-family="ui-monospace, monospace" font-size="13" fill="#4f46e5" text-anchor="middle" font-weight="700">[ ]</text>
    </g>
    <text x="60" y="88" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="700">Response</text>
    <text x="60" y="102" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6a7385" text-anchor="middle">24-hour plan</text>
  </g>

  <!-- Bottom caption -->
  <text x="600" y="377" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6a7385" text-anchor="middle" letter-spacing="0.5">Each stage has a safety net.</text>
</svg>
