<svg viewBox="0 0 1200 360" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GridWise Request Architecture Pipeline">
  <title>GridWise Request Pipeline</title>
  <desc>Flow of an energy optimization request from HTTP ingestion through Pydantic validation, multi-model LLM extraction, deterministic guardrails, and HiGHS LP solver to final response, with a heuristic fallback safety net.</desc>

  <defs>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a1d23" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>

    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>

    <marker id="loop-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Connectors between main stages -->
  <g stroke="#4f46e5" stroke-width="1.8" fill="none">
    <!-- 1 to 2 -->
    <line x1="185" y1="132" x2="218" y2="132" marker-end="url(#arrow-indigo)"/>
    <!-- 2 to 3 -->
    <line x1="365" y1="132" x2="398" y2="132" marker-end="url(#arrow-indigo)"/>
    <!-- 3 to 4 -->
    <line x1="610" y1="132" x2="643" y2="132" marker-end="url(#arrow-indigo)"/>
    <!-- 4 to 5 -->
    <line x1="790" y1="132" x2="823" y2="132" marker-end="url(#arrow-indigo)"/>
    <!-- 5 to 6 -->
    <line x1="975" y1="132" x2="1008" y2="132" marker-end="url(#arrow-indigo)"/>
  </g>

  <!-- Fallback Heuristic Branch (dotted line from LLM/LP to heuristic safety net) -->
  <g fill="none">
    <path d="M 505 220 L 505 265 Q 505 280 520 280 L 885 280 Q 900 280 900 265 L 900 200"
          stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
  </g>

  <!-- Fallback Heuristic Pill Label -->
  <g transform="translate(620, 266)">
    <rect width="170" height="28" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <text x="85" y="18" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#b45309">
      ⚡ Fallback Heuristic
    </text>
    <text x="85" y="40" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#92400e">
      honors hard caps on infeasible LP
    </text>
  </g>

  <!-- ================= CARD 1: REQUEST ================= -->
  <g transform="translate(40, 70)" filter="url(#soft-shadow)">
    <rect width="145" height="125" rx="12" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <!-- Icon: Document / Request -->
    <rect x="18" y="16" width="22" height="26" rx="3" fill="#f4f4f5" stroke="#71717a" stroke-width="1.2"/>
    <line x1="23" y1="23" x2="33" y2="23" stroke="#71717a" stroke-width="1.2"/>
    <line x1="23" y1="28" x2="31" y2="28" stroke="#71717a" stroke-width="1.2"/>
    <line x1="23" y1="33" x2="28" y2="33" stroke="#71717a" stroke-width="1.2"/>
    <text x="48" y="24" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#5a6271" letter-spacing="1">1 · INGEST</text>
    <text x="48" y="39" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1d23">Request</text>
    <line x1="16" y1="52" x2="129" y2="52" stroke="#f1eee7" stroke-width="1"/>
    <text x="72" y="74" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#4f46e5">POST /optimize-energy</text>
    <text x="72" y="94" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5a6271">24h load &amp; solar</text>
    <text x="72" y="109" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5a6271">1-3 operator notes</text>
  </g>

  <!-- ================= CARD 2: VALIDATE ================= -->
  <g transform="translate(220, 70)" filter="url(#soft-shadow)">
    <rect width="145" height="125" rx="12" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <!-- Icon: Checkmark Shield -->
    <circle cx="28" cy="28" r="12" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
    <path d="M 23 28 L 27 32 L 34 24" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="24" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#5a6271" letter-spacing="1">2 · VALIDATE</text>
    <text x="48" y="39" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1d23">Pydantic V2</text>
    <line x1="16" y1="52" x2="129" y2="52" stroke="#f1eee7" stroke-width="1"/>
    <text x="72" y="74" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#1a1d23">Strict Invariants</text>
    <text x="72" y="93" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5a6271">24 unique hours (0-23)</text>
    <text x="72" y="109" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#0d9488">HTTP 400 on error</text>
  </g>

  <!-- ================= CARD 3: LLM CHAIN (EMPHASIZED) ================= -->
  <g transform="translate(400, 45)" filter="url(#soft-shadow)">
    <rect width="210" height="175" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="105" y="22" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#4f46e5" letter-spacing="1.5">★ LLM CHAIN ★</text>

    <!-- Stacked Model Pills -->
    <!-- Pill 1: Primary (Active) -->
    <g transform="translate(14, 30)">
      <rect width="182" height="24" rx="6" fill="#4f46e5"/>
      <circle cx="12" cy="12" r="3.5" fill="#22c55e"/>
      <text x="22" y="16" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ffffff">gpt-oss-120b</text>
      <text x="172" y="16" text-anchor="end" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#c7d2fe">ACTIVE</text>
    </g>

    <!-- Pill 2: Backup 1 -->
    <g transform="translate(14, 58)">
      <rect width="182" height="24" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="12" y="16" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1a1d23">compound-mini</text>
      <text x="172" y="16" text-anchor="end" font-family="ui-monospace, monospace" font-size="8" fill="#5a6271">BACKUP</text>
    </g>

    <!-- Pill 3: Backup 2 -->
    <g transform="translate(14, 86)">
      <rect width="182" height="24" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="12" y="16" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1a1d23">qwen-3.8-27b</text>
      <text x="172" y="16" text-anchor="end" font-family="ui-monospace, monospace" font-size="8" fill="#5a6271">BACKUP</text>
    </g>

    <!-- Pill 4: Gemini Failover -->
    <g transform="translate(14, 114)">
      <rect width="182" height="24" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
      <circle cx="12" cy="12" r="3" fill="#0d9488"/>
      <text x="22" y="16" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#065f46">gemini-flash-lite</text>
      <text x="172" y="16" text-anchor="end" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#0d9488">FAILOVER</text>
    </g>

    <!-- Rotation footer tag with circular arrow icon -->
    <g transform="translate(105, 156)">
      <text x="0" y="0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#4f46e5">
        ↻ auto-rotate on 429 error
      </text>
    </g>
  </g>

  <!-- ================= CARD 4: GUARD ================= -->
  <g transform="translate(645, 70)" filter="url(#soft-shadow)">
    <rect width="145" height="125" rx="12" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <!-- Icon: Shield -->
    <path d="M 28 17 L 38 21 L 38 29 C 38 35 28 39 28 39 C 28 39 18 35 18 29 L 18 21 Z" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.3"/>
    <path d="M 25 28 L 27 30 L 32 25" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round"/>
    <text x="48" y="24" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#5a6271" letter-spacing="1">4 · GUARD</text>
    <text x="48" y="39" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1d23">Guardrails</text>
    <line x1="16" y1="52" x2="129" y2="52" stroke="#f1eee7" stroke-width="1"/>
    <text x="72" y="74" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#1a1d23">Deterministic</text>
    <text x="72" y="93" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5a6271">Hours clamp &amp; dedupe</text>
    <text x="72" y="109" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5a6271">Safe-fail to no_op</text>
  </g>

  <!-- ================= CARD 5: LP SOLVE ================= -->
  <g transform="translate(825, 70)" filter="url(#soft-shadow)">
    <rect width="150" height="125" rx="12" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <!-- Icon: Math Sigma -->
    <rect x="16" y="16" width="24" height="24" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="28" y="33" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c3aed">Σ</text>
    <text x="48" y="24" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#5a6271" letter-spacing="1">5 · OPTIMIZE</text>
    <text x="48" y="39" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1d23">HiGHS LP</text>
    <line x1="16" y1="52" x2="134" y2="52" stroke="#f1eee7" stroke-width="1"/>
    <text x="75" y="74" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#1a1d23">scipy.linprog</text>
    <text x="75" y="93" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5a6271">120 Decision Vars</text>
    <text x="75" y="109" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#0d9488">Optimal in ~3 ms</text>
  </g>

  <!-- ================= CARD 6: RESPONSE ================= -->
  <g transform="translate(1010, 70)" filter="url(#soft-shadow)">
    <rect width="150" height="125" rx="12" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <!-- Icon: JSON Curly Braces -->
    <rect x="16" y="16" width="24" height="24" rx="4" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
    <text x="28" y="32" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#0d9488">{ }</text>
    <text x="48" y="24" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#5a6271" letter-spacing="1">6 · OUTPUT</text>
    <text x="48" y="39" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1d23">Response</text>
    <line x1="16" y1="52" x2="134" y2="52" stroke="#f1eee7" stroke-width="1"/>
    <text x="75" y="74" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#0d9488">HTTP 200 OK</text>
    <text x="75" y="93" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5a6271">24h hourly plan</text>
    <text x="75" y="109" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5a6271">total_cost_bdt</text>
  </g>

  <!-- Caption at bottom -->
  <text x="600" y="338" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-style="italic" fill="#5a6271">
    Each stage has a safety net — validating inputs, auto-rotating models, clamping bounds, and guaranteeing feasible schedules.
  </text>
</svg>
